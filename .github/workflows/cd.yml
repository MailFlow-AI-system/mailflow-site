name: CD

on:
  push:
    branches: [development, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Worker environment
        type: choice
        options: [development, staging, production]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production') || (github.ref == 'refs/heads/staging' && 'staging') || 'development' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v$(<.node-version)"
          expected_bun_version="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).packageManager.split('@')[1])")"
          test "$(bun --version)" = "${expected_bun_version}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve targets
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="development"
          fi
          case "$ENV" in
            development) INFISICAL=dev ;;
            staging)     INFISICAL=staging ;;
            production)  INFISICAL=prod ;;
          esac
          echo "wrangler=$ENV" >> "$GITHUB_OUTPUT"
          echo "infisical=$INFISICAL" >> "$GITHUB_OUTPUT"

      - name: Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: a175ad2a-4760-4cb7-8b83-5533a22b7ce9
          project-slug: mail-flow-ai-x-jcd
          env-slug: ${{ steps.target.outputs.infisical }}
          secret-path: /mailflow-site
          export-type: env

      - name: Build and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_ENV: ${{ steps.target.outputs.wrangler }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
